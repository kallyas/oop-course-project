[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hybrid-power-optimizer"
version = "1.0.0"
description = "Object-oriented hybrid power optimisation simulator and dashboard for telecom base stations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tumuhirwe Iden" }]
keywords = ["oop", "simulation", "energy", "telecom", "optimisation", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "plotly>=5.18",
    "streamlit>=1.52",
    "typing-extensions>=4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "pandas-stubs>=2.1",
]

[project.scripts]
hybrid-power = "hybrid_power.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_power"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["hybrid_power"]
branch = true
omit = ["*/presentation/dashboard.py", "*/presentation/dashboard_entry.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "D", "ANN", "PL", "PT", "C4", "RET"]
ignore = [
    "D105",    # magic-method docstrings add noise
    "D107",    # __init__ is documented on the class
    "D401",    # allow descriptive (non-imperative) docstring summaries
    "B027",    # empty hook methods in ABCs are intentional optional overrides
    "PLR0917", # value-object constructors mirror their many fields
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "PLR0913", # config-heavy constructors legitimately take many keyword args
    "PLR2004", # domain constants are named where it matters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PLR"]
